<!DOCTYPE html>
<html>
    <head>
        <title>UUCMS - ಸಮಗ್ರ ವಿಶ್ವವಿದ್ಯಾಲಯ ಮತ್ತು ಕಾಲೇಜು ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <header>
            <!--First Navigation Bar-->
            <div class="top-nav-bar">
                <!--Right Hand side Elements-->
                <div class="contact-mail-block">
                    <i class="top-nav-bar-element fa-solid fa-envelope"></i>
                    <p class="top-nav-bar-element contact-mail">contact-uucms.helpdesk@gmail.com</p>
                </div>

                <!--Left Hand side Elements-->
                <div class="font-resizing">
                    <p class="theams dark-theam-icon font-resizing-elements cursor-pointor top-nav-bar-element">A</p>
                    <p class="theams light-theam-icon font-resizing-elements cursor-pointor top-nav-bar-element">A</p>

                    <!--Resizing Buttons-->
                    <button class="resize-button negative-fontsize font-resizing-elements cursor-pointor top-nav-bar-element">-</button>
                    <button class="resize-button fontsize font-resizing-elements cursor-pointor top-nav-bar-element">A</button>
                    <button class="resize-button positive-fontsize font-resizing-elements cursor-pointor top-nav-bar-element">+</button>
                </div>
            </div>

            <!--Second Navigation Bar-->
            <div class="nav-bar">
                <div class="uucms-image nav-bar-element">
                    <img src="./images/UUCMS.png" alt="UUCMS"></img>
                </div>
                
                <div class="cm-image nav-bar-element">
                    <img src="./images/CM.png" alt="CM">
                </div>
                
                <div class="govt-image nav-bar-element">
                    <img src="./images/govt_logo.png" alt="GOVT LOGO">
                </div>
                <div class="cursor-pointor translate-language">
                    <p class="language-letters language-hindi">अ</p>
                    <p class="language-letters language-english">A</p>
                </div>
            </div>
        </header>

        <!--Main Content-->
        <main>
            <!-- Back - to - home -->
            
            <div class="main-content-elements cursor-pointor back-to-home">
                <i class="fa-solid fa-backward"></i>
                Back To Home
            </div>
            
            <!--Main Login Content-->
            <div class="main-content-elements outer-login-box">
                <div class="main-content-elements login-box">
                    <div class="main-content-elements login-type">
                        <div class="main-content-elements login-type-element login-type-admin">State Admin</div>
                        <div class="main-content-elements login-type-element login-type-university">University</div>
                        <div class="main-content-elements login-type-element login-type-college">College/PG Center</div>
                        <div class="main-content-elements login-type-element login-type-student">Student</div>
                        <div class="main-content-elements login-type-element login-type-ksou">KSOU Reg Center</div>
                    </div>
                    
                    <!--User Name & Password-->
                    <div class="main-content-elements login-data">
                        <!--User Name-->
                        <div class="main-content-elements login-data-username">
                            <div class="log-data-names">
                                <p>Username</p>
                            </div>
                            <div class="input-username">
                                <input class="inputs" type="text" placeholder="Enter username">
                            </div>
                        </div>
                        
                        <!--Password-->
                        <div class="main-content-elements login-data-password">
                            <div class="log-data-names">
                                <p>Password</p>
                            </div>

                            <div class="password-eyes">

                                <div class="input-password">
                                    <input class="inputs" type="text" placeholder="Enter password">
                                </div>
                                
                                <div class="hide-or-show">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </div>
                            </div>
                        </div>

                        <!--Forgot Password-->
                        <div class="forgot-password">
                            <div class="forgot-password-items">
                                <p class="forgot-items">Forgot Password?</p>
                                <a class="forgot-pass-link forgot-items" href="https://uucms.karnataka.gov.in/Contact/ForgotPassword">Click Here</a>
                            </div>
                        </div>

                        <!--Captcha-->
                        <div class="captcha">
                            <div class="label captcha-item">Enter Captcha</div>

                            <div class="captcha-items captcha-item">
                                <div class="captcha-image">
                                    <img src="./images/captcha.png" alt="captcha">
                                </div>

                                <div class="refresh-captcha cursor-pointor captcha-item">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <div class="captcha-enter captcha-item">
                                <input class="inputs captcha-input" type="text" placeholder="Enter Captcha">
                                </div>
                            </div>
                        </div>

                        <!--Login Button-->
                        <div class="login">
                            <div class="login-icon cursor-pointor">
                                Log In
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
